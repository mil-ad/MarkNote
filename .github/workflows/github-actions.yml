name: Release MarkNote ankiaddon

# Manual: bump "human_version" in MarkNote/manifest.json, merge, then run this.
# It tags the commit v<version> and attaches MarkNote.ankiaddon. The tag also
# pins the CDN fallback for _render.js (see constants.py), so it must exist
# for the version that ships.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("MarkNote/manifest.json"))["human_version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ankiaddon
        run: make package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MarkNote v${{ steps.version.outputs.version }}
          files: MarkNote.ankiaddon
          fail_on_unmatched_files: true
